# strongSwan IPSec 설정 - AWS Site-to-Site VPN
# 물리서버(worker1) ↔ AWS VPC 연결
# CGW IP: 106.240.19.114
# 실제 송신 NIC IP: 211.170.162.113

config setup
    charondebug="all"
    uniqueids=yes

conn %default
    keyexchange=ikev1
    type=tunnel
    authby=secret

    # 실제 송신 NIC IP
    left=211.170.162.113
    # AWS CGW에 등록된 공인 IP
    leftid=106.240.19.114
    # VPN 트래픽 소스 /32 (Tailscale + 물리서버)
    leftsubnet=100.110.110.3/32,100.70.66.39/32,100.98.215.80/32

    # AWS VPC 대역
    rightsubnet=10.0.0.0/16

    # IKE / ESP 알고리즘 (AWS Phase1/Phase2 맞춤)
    ike=aes128-sha1-modp1024!
    esp=aes128-sha1-modp1024!

    # NAT-T 강제 활성화
    forceencaps=yes

    # 재시도 및 DPD 설정
    keyingtries=0
    keylife=28800s
    lifetime=3600s
    mobike=no
    dpdaction=restart
    dpddelay=10s
    dpdtimeout=30s

# 주 터널 (자동 연결)
conn Tunnel1
    right=43.201.173.43
    rightid=43.201.173.43
    auto=start

# 보조 터널 (장애 시 수동 전환)
conn Tunnel2
    right=52.79.124.155
    rightid=52.79.124.155
    auto=add

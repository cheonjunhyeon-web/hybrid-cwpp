# Kafka Broker 1 설정 - cp2 (192.168.1.11)
broker.id=1
listeners=PLAINTEXT://192.168.1.11:9092
advertised.listeners=PLAINTEXT://192.168.1.11:9092
log.dirs=/var/lib/kafka/data-1
log.dir=/var/log/kafka/broker-1
zookeeper.connect=192.168.1.10:2181,192.168.1.11:2181,192.168.1.12:2181
num.partitions=3
default.replication.factor=3
min.insync.replicas=2

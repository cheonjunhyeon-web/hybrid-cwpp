# Kafka Broker 2 설정 - cp3 (192.168.1.12)
broker.id=2
listeners=PLAINTEXT://192.168.1.12:9092
advertised.listeners=PLAINTEXT://192.168.1.12:9092
log.dirs=/var/lib/kafka/data-2
log.dir=/var/log/kafka/broker-2
zookeeper.connect=192.168.1.10:2181,192.168.1.11:2181,192.168.1.12:2181
num.partitions=3
default.replication.factor=3
min.insync.replicas=2
log.retention.hours=168
num.network.threads=3
num.io.threads=8

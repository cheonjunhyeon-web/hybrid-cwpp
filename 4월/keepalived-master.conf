# Keepalived MASTER 설정 - cp1 전용
# VIP: 192.168.1.100
# cp1 장애 시 cp2로 VIP 자동 이전
# 설치: sudo apt install -y keepalived

vrrp_instance VI_1 {
    state MASTER
    interface eno1
    virtual_router_id 51
    priority 100
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass 1234
    }
    virtual_ipaddress {
        192.168.1.100/24
    }
}
